name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  WRANGLER: wrangler@4.152.0
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check

      - name: Upload a Worker version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-upload.ndjson
        run: |
          npx --yes "$WRANGLER" versions upload --tag "$GITHUB_SHA" --message "$GITHUB_SHA"
          id=$(node -e 'const fs=require("fs"); const rows=fs.readFileSync(process.argv[1],"utf8").trim().split("\n").map(JSON.parse); const row=rows.find(r=>r.type==="version-upload"); if(!row?.version_id)process.exit(1); console.log(row.version_id)' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "version_id=$id" >> "$GITHUB_OUTPUT"

      - name: Let the upload settle
        run: sleep 30

      - name: Activate the version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "$WRANGLER" versions deploy "${{ steps.upload.outputs.version_id }}@100%" --message "$GITHUB_SHA" --yes

      # This config contains no domain routes. Domain ownership is provisioned
      # separately with Hatchkit's local operator credential.
      - name: Enable the preview address
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "$WRANGLER" triggers deploy

      - name: Verify the released version
        env:
          SITE_URL: https://tic-tac-toe.ricoslabs.workers.dev
        run: |
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 "$SITE_URL/version.json" -o "$RUNNER_TEMP/version.json"
          node -e 'const v=require(process.argv[1]); if(v.sha!==process.env.GITHUB_SHA)throw new Error("Wrong deployed version")' "$RUNNER_TEMP/version.json"
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 --max-time 30 "$SITE_URL/" -o "$RUNNER_TEMP/home.html"

      - name: Record the web deploy
        uses: ./.github/actions/record-ship
        with:
          environment: web
          url: https://tic-tac-toe.ricoslabs.workers.dev
